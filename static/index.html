<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Pesquisa Termos ITED - ANACOM</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:20px;background:#f5f5f5}
h1{color:#1a3a5c}
.card{background:#fff;padding:16px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0}
label{font-weight:600;font-size:14px}
select,button{padding:6px 10px;font-size:14px}
button{background:#1a3a5c;color:#fff;border:none;border-radius:4px;cursor:pointer}
button:hover{background:#2a5a8c}
button.secondary{background:#666}
.periodos button{margin-right:6px}
.periodos button.active{background:#c0392b}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border:1px solid #ddd;padding:6px;text-align:left}
th{background:#1a3a5c;color:#fff}
tr:nth-child(even){background:#f9f9f9}
.status{color:#555;font-style:italic}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:#1a3a5c;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>Pesquisa Termos de Responsabilidade ITED</h1>
<div class="card">
  <div class="row">
    <label>Distrito:</label>
    <select id="distrito"></select>
    <label>Concelho:</label>
    <select id="concelho"></select>
  </div>
  <div class="row periodos">
    <label>Período:</label>
    <button data-sem="1">1 semana</button>
    <button data-sem="2">2 semanas</button>
    <button data-sem="3">3 semanas</button>
    <button data-sem="4">4 semanas</button>
  </div>
  <div class="row">
    <button id="btnPesquisar">Pesquisar</button>
    <span id="status" class="status"></span>
  </div>
  <p style="font-size:12px;color:#777">Fixo: Tipo de termo = Execução | Tipo de edifício = Residencial (habitacional)</p>
</div>

<div class="card" id="cardResultados" style="display:none">
  <h3>Resultados da pesquisa <span id="totalRes"></span></h3>
  <table id="tblResultados">
    <thead><tr><th>Termo</th><th>Emitido</th><th>Nome</th><th>N.º inscrição</th><th>Morada</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="row" style="margin-top:10px">
    <button id="btnExtrair">Extrair PDFs (≥3 fogos)</button>
    <span id="status2" class="status"></span>
  </div>
</div>

<div class="card" id="cardExtraidos" style="display:none">
  <h3>Dados extraídos <span id="totalExt"></span></h3>
  <table id="tblExtraidos">
    <thead><tr><th>Termo</th><th>Data emissão</th><th>Fogos</th><th>Rua</th><th>Localidade</th><th>Código Postal</th><th>Coordenadas</th><th>Dono de obra</th><th>Data certificado</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="row" style="margin-top:10px">
    <button id="btnExportar">Exportar para Excel</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let semanasSel = 1;
let lastResults = [];

// periodos
document.querySelectorAll('.periodos button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.periodos button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    semanasSel = parseInt(b.dataset.sem);
  });
});
document.querySelector('.periodos button[data-sem="1"]').classList.add('active');

// load distritos
fetch('/api/distritos').then(r=>r.json()).then(list=>{
  const sel=$('distrito');
  list.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o);});
  sel.addEventListener('change', loadConcelhos);
  loadConcelhos();
});
function loadConcelhos(){
  const d=$('distrito').value;
  fetch('/api/concelhos?distrito='+encodeURIComponent(d)).then(r=>r.json()).then(list=>{
    const sel=$('concelho'); sel.innerHTML='';
    list.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=(c==='-'?'Todos os concelhos':c);sel.appendChild(o);});
  });
}

function setStatus(msg, spin){ $('status').innerHTML = spin? '<span class="spinner"></span> '+msg : msg; }
function setStatus2(msg, spin){ $('status2').innerHTML = spin? '<span class="spinner"></span> '+msg : msg; }

$('btnPesquisar').addEventListener('click', ()=>{
  setStatus('A pesquisar...', true);
  const body = {distrito:$('distrito').value, concelho:$('concelho').value, semanas:semanasSel};
  fetch('/api/pesquisar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(r=>r.json()).then(d=>{
    setStatus('Pesquisa concluída: '+d.total+' resultados');
    lastResults = d.resultados || [];
    const tbody=$('tblResultados').querySelector('tbody'); tbody.innerHTML='';
    lastResults.forEach(r=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${r.termo}</td><td>${r.emitido}</td><td>${r.nome}</td><td>${r.num_inscricao}</td><td>${r.morada}</td>`;
      tbody.appendChild(tr);
    });
    $('totalRes').textContent = '('+d.total+')';
    $('cardResultados').style.display='block';
    $('cardExtraidos').style.display='none';
  }).catch(e=>setStatus('Erro: '+e));
});

$('btnExtrair').addEventListener('click', ()=>{
  if(!lastResults.length){ setStatus2('Sem resultados'); return; }
  setStatus2('A descarregar e extrair PDFs...', true);
  fetch('/api/extrair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:lastResults})})
  .then(r=>r.json()).then(d=>{
    setStatus2('Processados: '+d.processados+' | Extraídos (≥3 fogos): '+d.extraidos);
    const tbody=$('tblExtraidos').querySelector('tbody'); tbody.innerHTML='';
    (d.dados||[]).forEach(r=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${r.termo}</td><td>${r.data_emissao}</td><td>${r.num_fogos}</td><td>${r.rua}</td><td>${r.localidade}</td><td>${r.codigo_postal}</td><td>${r.coordenadas}</td><td>${r.dono_obra}</td><td>${r.data_certificado}</td>`;
      tbody.appendChild(tr);
    });
    $('totalExt').textContent = '('+(d.dados?d.dados.length:0)+')';
    $('cardExtraidos').style.display='block';
  }).catch(e=>setStatus2('Erro: '+e));
});

$('btnExportar').addEventListener('click', ()=>{
  window.location.href='/api/exportar.xlsx';
});
</script>
</body>
</html>
